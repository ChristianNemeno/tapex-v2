services:
  mcq-extractor:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
      - uploads_data:/app/uploads
      - paddle_data:/root/.paddleocr
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  media_data:
  uploads_data:
  paddle_data:
